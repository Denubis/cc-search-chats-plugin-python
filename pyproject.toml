[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-search-chats"
version = "2.3.1"
description = "Search and extract Claude Code chat history"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
authors = [
    {name = "pcvelz"},
    {name = "akatz-ai"},
    {name = "Brian Ballsun-Stanton"},
]
dependencies = [
    "psycopg[c]>=3.3.4,<3.4",
]

[project.scripts]
cc-search-chats = "cc_search_chats.bootstrap:main"

[project.optional-dependencies]
semantic = [
    "torch>=2.9,<3",
    "transformers>=5.2,<6",
]

[dependency-groups]
dev = [
    "complexipy>=5.2.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "ruff>=0.16.3",
    "ty==0.0.73",  # exact pin — pre-1.0; minor bumps change diagnostics and suppression handling; bump deliberately
    "hypothesis>=6.80",
    "pyyaml>=6,<7",
    "vulture>=2.14",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
    "PT",     # flake8-pytest-style
    "PERF",   # Perflint
    "T20",    # flake8-print
    "TRY",    # tryceratops
    "N",      # pep8-naming
    "DTZ",    # flake8-datetimez
    "BLE",    # flake8-blind-except
    "RET",    # flake8-return
    "PIE",    # flake8-pie
    "ISC",    # flake8-implicit-str-concat
    "RSE",    # flake8-raise
    "G",      # flake8-logging-format
    "LOG",    # flake8-logging
    "PGH",    # pygrep-hooks
    "FURB",   # refurb
    "FLY",    # flynt
    "Q",      # flake8-quotes
    "A",      # flake8-builtins
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0917",  # Too many positional arguments; same rationale as PLR0913
    "PLR2004",  # Magic value comparison
    "TRY003",   # Message-style exception text is deferred to a later cleanup step
    # Complexipy owns the temporary complexity baseline; re-enable after refactoring.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"src/cc_search_chats/bootstrap.py" = [
    "PLC0415",  # CLI import is delayed until after the invocation clock starts
]
"src/cc_search_chats/cli.py" = [
    "N818",  # public name; rename is a contract change
    "T201",  # CLI stdout and stderr text are the module's public contract
    "S603",  # systemctl is a fixed executable invoked with a fixed argument vector
    "S606",  # systemd-run is a fixed executable used for the bootstrap re-exec
    "S607",  # fixed executable names intentionally rely on the operator's PATH
    "TRY301",  # deadline raises intentionally enter the CLI diagnostic boundary
]
"src/cc_search_chats/output.py" = [
    "E501",  # exact terminal template literals cannot be wrapped byte-neutrally
]
"src/cc_search_chats/providers/claude.py" = [
    "TC001",  # RecordEnvelope annotates a dataclass field evaluated at runtime
]
"src/cc_search_chats/semantic/model.py" = [
    "N818",  # public name; rename is a contract change
]
"src/cc_search_chats/semantic/query_embedder.py" = [
    "S603",  # fixed interpreter/module command launches the detached local helper
    "T201",  # detached helper reports fatal startup failures only to its log stream
]
"src/cc_search_chats/storage/index.py" = [
    "PLC0415",  # late imports preserve patchable discovery and query-builder seams
    "T201",  # the legacy CLI adapter reports source warnings on stderr
    "TRY301",  # damage raises intentionally enter the rollback boundary
]
"src/cc_search_chats/storage/postgresql/guardrails.py" = [
    "N818",  # public name; rename is a contract change
]
"src/cc_search_chats/storage/postgresql/__init__.py" = [
    "RUF022",  # public export ordering is retained as module metadata
]
"src/cc_search_chats/storage/postgresql/migrations.py" = [
    "N818",  # public name; rename is a contract change
]
"src/cc_search_chats/storage/postgresql/semantic.py" = [
    "TRY301",  # candidate-build raises intentionally enter failure-ledger handling
]
"scripts/*.py" = [
    "T201",  # operator scripts report their outcome on stdout and stderr
]
"tests/**/*.py" = [
    "S101",     # Assertions are the primary test mechanism
    "S105",     # Hardcoded test tokens and passwords are intentional fixtures
    "S106",     # Hardcoded test tokens passed as arguments are intentional fixtures
    "S108",     # Temporary paths are intentional test fixtures
    "E501",     # Long fixture and expectation literals cannot wrap
    "PLC0415",  # Local imports are intentional for deferred-import tests
    "PLR0915",  # Journey tests are deliberately long single narratives
]
"tests/postgresql/conftest.py" = [
    "S603",     # drives initdb/pg_ctl for the disposable cluster with test-owned absolute paths
    "ARG001",   # postgres_connection requests clean_postgres_schema for its side effect; pytest resolves fixtures by parameter name
]
"tests/test_plugin_packaging.py" = [
    "S603",     # drives fish, codex, and sys.executable as a user would
    "S607",     # the bare executable name on PATH is the contract under test, guarded by shutil.which skipif
]
"tests/test_query_embedder.py" = [
    "S603",  # fixed interpreter/module command exercises the guarded helper boundary
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["cc_search_chats"]

[tool.ty.environment]
python-version = "3.14"

[tool.vulture]
paths = ["src/cc_search_chats"]
min_confidence = 80
ignore_names = [
    "pair",                    # Tokenizer Protocol keyword parameter
    "add_special_tokens",      # Tokenizer Protocol keyword parameter
    "return_offsets_mapping",  # Tokenizer Protocol keyword parameter
    "HUMAN",                   # Closed SubmittedBy vocabulary member
    "use_cache",               # Transformers configuration attribute assignment
    "row_factory",             # sqlite3 Connection attribute assignment
    "search_full_content",     # Tested legacy CC_SEARCH_DB_PATH compatibility API
    "corpus_revision_id",      # Tested legacy-prune result field
    "semantic_revision_id",    # Tested legacy-prune result field
    "scanned_rows",            # Tested legacy-import result field
    "new_pool_rows",           # Tested legacy-import result field
    "pool_rows_after",         # Tested legacy-import result field
]

[tool.complexipy]
paths = ["src/cc_search_chats"]
max_complexity_allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--tb=short"]
pythonpath = ["src"]
markers = ["postgresql: requires the disposable PostgreSQL 18 test cluster"]
