[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-search-chats"
version = "2.0.0a5"
description = "Search and extract Claude Code chat history"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
authors = [
    {name = "pcvelz"},
    {name = "akatz-ai"},
    {name = "Brian Ballsun-Stanton"},
]
dependencies = [
    "psycopg[c]>=3.3.4,<3.4",
]

[project.scripts]
cc-search-chats = "cc_search_chats.cli:main"

[project.optional-dependencies]
semantic = [
    "torch>=2.9,<3",
    "transformers>=5.2,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.2",
    "ty>=0.0.15",
    "hypothesis>=6.80",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["cc_search_chats"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--tb=short"]
pythonpath = ["src"]
markers = ["postgresql: requires the disposable PostgreSQL 18 test cluster"]
